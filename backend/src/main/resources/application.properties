## ---------------------------------------------
## 1. Application/Security
## ---------------------------------------------
spring.application.name=finsight
spring.security.user.name=ravindar
spring.security.user.password=finsight

## ---------------------------------------------
## 2. H2 Console
## ---------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## ---------------------------------------------
## 3. Database Connection (File-Based H2)
## ---------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/finsightdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## ---------------------------------------------
## 4. JPA/Hibernate Configuration
## ---------------------------------------------
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

## ---------------------------------------------
## 5. SQL Initialization FIX (The key changes)
## ---------------------------------------------
# 5a. Ensure schema and data scripts run always, even with a file-based H2
spring.sql.init.mode=always
# 5b. Defer initialization until after JPA setup (good practice when using Hibernate for DDL)
spring.jpa.defer-datasource-initialization=true

## ---------------------------------------------
## 6. Optional: Debugging (Highly Recommended)
## ---------------------------------------------
# Set this to DEBUG to see log messages confirming data.sql execution
# logging.level.org.springframework.jdbc.datasource.init=DEBUG

spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash